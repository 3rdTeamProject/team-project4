<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>수확 흐름 미리보기</title>
  <style>
    body{margin:0;padding:24px;background:#f8f1e2;color:#1f2a1c;font:14px system-ui,sans-serif}
    .preview{max-width:430px;margin:auto}
    h1{font-size:20px;margin:0 0 8px}
    p{line-height:1.5;margin:0 0 16px}
    .controls{display:flex;gap:8px;margin-bottom:16px}
    select,button{min-height:44px;padding:8px 12px;border:1px solid #91ad82;border-radius:12px;background:white;color:#1f2a1c;font:inherit}
    select{flex:1}button{cursor:pointer}
    iframe{display:block;width:100%;height:760px;border:1px solid #dde6d2;border-radius:16px;background:white}
    .hint{font-size:12px;color:#5e6b58;margin-top:12px}
  </style>
</head>
<body>
  <div class="preview">
    <h1>수확 흐름 미리보기</h1>
    <p>재배기간을 채운 작물입니다. 아래 화면에서 <b>수확하기</b>를 누르고, 완료 후 일지도 작성해 보세요.</p>
    <div class="controls">
      <select id="crop" aria-label="미리 볼 작물">
        <option value="lettuce">상추 · 45일</option>
        <option value="tomato">방울토마토 · 90일</option>
        <option value="cucumber">오이 · 60일</option>
        <option value="pepper">고추 · 90일</option>
        <option value="potato">감자 · 100일</option>
        <option value="eggplant">가지 · 85일</option>
        <option value="zucchini">애호박 · 60일</option>
      </select>
      <button id="restart" type="button">예시 초기화</button>
    </div>
    <iframe id="garden" title="수확 기능 체험" src="index.html"></iframe>
    <p class="hint">이 페이지의 예시는 실제 농장 데이터와 별도로 시작하며, 초기화하면 수확 전 상태로 돌아갑니다.</p>
  </div>
  <script>
    const crops={lettuce:45,tomato:90,cucumber:60,pepper:90,potato:100,eggplant:85,zucchini:60};
    const frame=document.querySelector('#garden');
    function previewState(){
      const kind=document.querySelector('#crop').value;
      const planted=new Date();
      planted.setDate(planted.getDate()-crops[kind]-1);
      return {farms:[{id:'harvest-preview',name:'수확 예시 농장',region:'',plots:[{
        kind,stage:5,method:'seed',needsWater:false,wateredAt:null,
        plantedAt:planted.toLocaleDateString('sv-SE')
      },null,null,null,null,null]}],records:[],points:0,settings:{motion:true}};
    }
    window.addEventListener('message',event=>{
      if(event.origin!==location.origin||event.source!==frame.contentWindow)return;
      if(event.data?.type==='garden:ready')frame.contentWindow.postMessage({type:'garden:init',userId:'harvest-preview',view:'detail',state:previewState()},location.origin);
      if(event.data?.type==='garden:height')frame.style.height=Math.max(700,event.data.height)+'px';
    });
    function restart(){frame.src='index.html'}
    document.querySelector('#crop').addEventListener('change',restart);
    document.querySelector('#restart').addEventListener('click',restart);
  </script>
</body>
</html>
