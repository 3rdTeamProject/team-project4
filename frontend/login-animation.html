<title>텃밭 로그인 애니메이션</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gamja+Flower&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* One full-screen scene: sky, hills, a garden that grows from separate drawn pieces, and the form on a wooden sign. Single light look on purpose. */
:root {
  --sky-top: #F2F3DD;
  --sky-mid: #F8F1E2;
  --hill-a: #E2ECC8;
  --hill-b: #CFE3B0;
  --fg: #1F2A1C;
  --muted: #55604F;
  --accent: #6FB06B;
  --accent-edge: #4E8A4B;
  --on-accent: #1F2A1C;
  --focus: #1D4E73;
  --wood: #B9896F;
  --wood-edge: #8A5E47;
  --wood-ink: #3B2618;
  --paper: #FFFDF6;
  --display: 'Noto Sans KR', system-ui, sans-serif;
  --hand: 'Gamja Flower', 'Noto Sans KR', cursive;
  --body: 'Noto Sans KR', system-ui, sans-serif;
}
html, body { height: 100%; }
body { background: var(--sky-mid); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.5; padding: 0; }
.scene {
  position: relative; max-width: 430px; min-height: 100%; margin-inline: auto;
  padding-inline: 20px; padding-block: 44px 36px;
  display: flex; flex-direction: column; justify-content: flex-start; gap: 10px;
  overflow: hidden; isolation: isolate;
  background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 40%, var(--sky-mid) 60%);
}

.head { margin-top: auto; }
h1 { margin: 0; text-align: center; font: 700 26px/1.3 var(--display); text-wrap: balance; }
.lead { margin: 2px 0 0; text-align: center; color: var(--muted); }


/* ---- sky and meadow ---- */
.sky { position: absolute; inset: 0 0 auto 0; height: 260px; z-index: -1; pointer-events: none; }
.sun { position: absolute; right: 30px; top: 58px; width: 76px; }
.cloud { position: absolute; }
.cloud.c1 { left: 22px; top: 96px; width: 92px; }
.cloud.c2 { left: 160px; top: 54px; width: 62px; opacity: .85; }
.sky svg { display: block; width: 100%; height: auto; }
.meadow { position: absolute; z-index: 0; left: -30%; width: 160%; top: 96%; height: 700px; background: var(--hill-b); border-radius: 50% 50% 0 0 / 110px 110px 0 0; }
.meadow.b { top: 88%; left: -45%; width: 190%; background: var(--hill-a); border-radius: 50% 50% 0 0 / 90px 90px 0 0; }
.tagline { margin: 0 0 2px; text-align: center; font: 400 19px/1.1 var(--hand); color: #4E8A4B; }

/* ---- garden pieces: each layer is its own image, animated on its own ---- */
.stage { position: relative; width: 125%; margin-inline: -12.5%; aspect-ratio: 1254 / 610; margin-block: 0 24px; }
.L { position: absolute; }
.L svg { display: block; width: 100%; height: auto; transform-origin: 50% 100%; }
.L img { display: block; width: 100%; height: auto; transform-origin: 50% 100%; user-select: none; -webkit-user-drag: none; }
.flower svg { display: block; width: 100%; height: auto; overflow: visible; }
.ground svg { height: 100%; }
.radish svg { overflow: visible; }
.L.soil, .L.can { opacity: 0; }            /* only exist during the intro */
.can .part { position: absolute; }
.can .part img { transform-origin: 50% 50%; }

/* ---- timeline (about 6.5 s) ---- */
.run .head { animation: fadeUp .8s ease-out 5s both; }
.run .soil { animation: soil 3.7s ease-in-out 0s both; }
.run .soil img { animation: sproutGrow 3.7s cubic-bezier(.3,.8,.3,1) 0s both; }
.run .can { animation: canFly 3.4s ease-in-out .2s both; }
.run .drop img { animation: fall .95s ease-in .9s 3 both; }
.run .drop.d2 img { animation-delay: 1.15s; }
.run .drop.d3 img { animation-delay: 1.4s; }
.run .ground { animation: groundIn 1s ease-out 3.2s both; transform-origin: 50% 100%; }
.run .fence img { animation: fenceIn .9s cubic-bezier(.2,.9,.3,1.1) 3.4s both; }
.run .bush img, .run .bush svg { animation: growUp 1.5s cubic-bezier(.2,1.25,.4,1) var(--d, 3.8s) both; }
.run .tomato img { animation: growUp 1.5s cubic-bezier(.2,1.25,.4,1) var(--d, 4.5s) both; }
.run .flower { animation: flowerPop .9s cubic-bezier(.2,1.4,.4,1) var(--d, 5.2s) both; transform-origin: 50% 100%; }
.run .bush { animation: sway 4.2s ease-in-out 6s infinite alternate; transform-origin: 50% 100%; }
.run .tomato { animation: sway 3.6s ease-in-out 6.2s infinite alternate-reverse; transform-origin: 50% 100%; }
.run .signwrap { animation: signUp .9s cubic-bezier(.2,.9,.3,1.1) 5.3s both; }
.run .btn { animation: pop .6s ease-out 6.3s both; }
.run .btn.guest { animation-delay: 6.45s; }
.run .meadow.b { animation: hillIn 1.6s ease-out both; }
.run .meadow.a { animation: hillIn 1.6s ease-out .3s both; }
.run .sun { animation: sunIn 1s cubic-bezier(.2,1.3,.4,1) .2s both; }
.run .cloud { animation: drift 7s ease-in-out infinite alternate; }
.run .cloud.c2 { animation-duration: 9s; animation-direction: alternate-reverse; }

@keyframes soil { 0% { opacity: 0; } 8% { opacity: 1; } 78% { opacity: 1; } 100% { opacity: 0; } }
@keyframes sproutGrow { 0% { transform: scale(.35); } 12% { transform: scale(.55); } 60% { transform: scale(1); } 100% { transform: scale(1.05); } }
@keyframes canFly {
  0% { opacity: 0; transform: translate(30%, -30%) rotate(14deg); }
  18% { opacity: 1; transform: none; }
  30% { transform: rotate(-2deg); }
  44% { transform: rotate(0); }
  58% { transform: rotate(-2deg); }
  72% { opacity: 1; transform: rotate(0); }
  100% { opacity: 0; transform: translate(30%, -30%) rotate(12deg); }
}
@keyframes fall {
  0% { opacity: 0; transform: translateY(-40%); }
  20% { opacity: 1; }
  80% { opacity: 1; }
  100% { opacity: 0; transform: translateY(330%); }
}
@keyframes fenceIn { from { opacity: 0; transform: translateY(18%); } to { opacity: 1; transform: none; } }
@keyframes growUp { from { opacity: 0; transform: scale(.12); } 25% { opacity: 1; } to { opacity: 1; transform: scale(1); } }
@keyframes flowerPop { from { opacity: 0; transform: scale(.1); } 30% { opacity: 1; } to { opacity: 1; transform: scale(1); } }
@keyframes groundIn { from { opacity: 0; transform: scaleX(.5); } to { opacity: 1; transform: none; } }
@keyframes sunIn { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: none; } }
@keyframes drift { from { transform: translateX(-10px); } to { transform: translateX(14px); } }
@keyframes sway { from { transform: rotate(-.8deg); } to { transform: rotate(.8deg); } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes signUp { from { opacity: 0; transform: translateY(70px); } to { opacity: 1; transform: none; } }
@keyframes hillIn { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.05); } 100% { transform: scale(1); } }

/* ---- sign with the form ---- */
.signwrap { position: relative; padding-top: 6px; }
.sign {
  position: relative; display: flex; flex-direction: column; gap: 10px;
  padding: 18px 18px 18px; background: var(--wood);
  border: 3px solid var(--wood-edge); border-radius: 18px;
  box-shadow: 0 6px 0 rgba(138, 94, 71, .35);
}
.sign::before, .sign::after { content: ""; position: absolute; top: 100%; width: 14px; height: 30px; background: var(--wood-edge); border-radius: 0 0 4px 4px; z-index: -1; }
.sign::before { left: 15%; }
.sign::after { right: 15%; }
.sign .intro { margin: 0; text-align: center; font: 400 22px/1.1 var(--hand); color: var(--wood-ink); }
label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
input {
  box-sizing: border-box; width: 100%; height: 52px; padding: 0 16px;
  background: var(--paper); color: var(--fg);
  border: 2px solid var(--wood-edge); border-radius: 14px; font: 500 16px var(--body);
}
input::placeholder { color: #6B6A5E; }
input:focus-visible, button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.btn.kakao { background: #FEE500; box-shadow: 0 4px 0 #CDB800; }
.btn.guest { background: var(--paper); border: 2px solid var(--wood-edge); box-shadow: 0 4px 0 rgba(138, 94, 71, .45); }
.btn {
  height: 52px; border: 0; border-radius: 16px; background: var(--accent); color: var(--on-accent);
  font: 700 16px var(--body); cursor: pointer; box-shadow: 0 4px 0 var(--accent-edge);
}
.state { display: flex; flex-direction: column; gap: 10px; }
.state[hidden] { display: none; }
.state.in .intro, .state.in .sum, .state.in .msg { color: #1A0E05; font-weight: 700; }
.state.in .intro { font-size: 24px; font-weight: 400; white-space: nowrap; }
.state.in .sum { font-size: 15px; }
.state.in .sum b { background: #F6C662; color: #1A0E05; border-radius: 999px; padding: 1px 9px; }
.sum { font-size: 14px; }
.state.in .other { text-decoration: none; padding: 0; height: 40px; background: var(--paper); border: 2px solid var(--wood-edge); border-radius: 14px; font: 700 14px var(--body); color: #3B2618; cursor: pointer; }
.sum { margin: 0; text-align: center; font-size: 15px; color: var(--wood-ink); }
.sum b { color: #3E7A3B; }
.btn.go { background: #2F7D32; color: #fff; font-size: 17px; box-shadow: 0 4px 0 #1E5A21; }
.auto { height: 6px; border-radius: 3px; background: rgba(255,253,246,.55); overflow: hidden; }
.auto i { display: block; height: 100%; width: 0; background: var(--paper); }
.auto.on i { width: 100%; transition: width 3s linear; }
.other { background: none; border: 0; padding: 6px; font: 500 13px var(--body); color: var(--wood-ink); text-decoration: underline; cursor: pointer; }
.seg { display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: rgba(255,255,255,.7); border: 2px solid var(--hill-b); }
.seg button { flex: 1; height: 36px; border: 0; border-radius: 10px; background: none; font: 700 14px var(--body); color: var(--fg); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: #1F2A1C; }
.msg { margin: 0; min-height: 22px; font-size: 14px; color: var(--wood-ink); text-align: center; }
.foot { display: flex; flex-direction: column; gap: 8px; margin-top: 22px; }
.replay {
  height: 44px; background: rgba(255,255,255,.7); color: var(--fg);
  border: 2px solid var(--hill-b); border-radius: 14px; font: 700 14px var(--body); cursor: pointer;
}
.note { margin: 0; font-size: 12px; line-height: 1.6; color: var(--muted); text-align: center; }

@media (prefers-reduced-motion: reduce) {
  .replay { display: none; }
}
</style>

(function () {

  var stOut = document.getElementById('stOut'), stIn = document.getElementById('stIn');
